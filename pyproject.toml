[project]
name = "hy3d-mcp"
version = "0.6.0"
description = "MCP server wrapping the local Hunyuan3D-MLX image-to-3D pipeline: concept image in, textured GLB out"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jim Cline" }]
keywords = ["mcp", "3d", "hunyuan3d", "mlx", "image-to-3d"]
dependencies = [
    "fastmcp>=2.0",
    "pillow>=10.0",
]

[project.scripts]
hy3d-mcp = "hy3d_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hy3d_mcp"]

# No force-include: install.sh is the macOS installer and nothing reads it
# now that setup_engine points at scripts/provision-engine.sh by name. The
# CUDA installer gets wired up (and shipped) in the next phase of the port.
