[project]
name = "hy3d-mcp"
version = "0.7.0"
description = "MCP server wrapping the local Hunyuan3D-MLX image-to-3D pipeline: concept image in, textured GLB out"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jim Cline" }]
keywords = ["mcp", "3d", "hunyuan3d", "mlx", "image-to-3d"]
dependencies = [
    "fastmcp>=2.0",
    "pillow>=10.0",
]

[project.scripts]
hy3d-mcp = "hy3d_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hy3d_mcp"]

# setup_engine runs install.sh, so a plugin install needs a copy of it: a
# wheel carries no repo root. _find_installer prefers the checkout's copy
# when there is one, and falls back to this.
[tool.hatch.build.targets.wheel.force-include]
"install.sh" = "hy3d_mcp/install.sh"
